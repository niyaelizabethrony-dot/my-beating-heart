<!DOCTYPE html>
<html>
<head>
<title>Holographic Heart</title>

<style>
body {
    background: #050817;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.heart {
    font-size: 300px;
    filter: drop-shadow(0 0 15px #ff1744)
            drop-shadow(0 0 35px #ff1744);
    animation: heartbeat 0.9s infinite;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }
    25% {
        transform: scale(1.25);
    }
    50% {
        transform: scale(1);
    }
    75% {
        transform: scale(1.15);
    }
}

.particle {
    position: absolute;
    color: #ff477e;
    animation: float 4s infinite linear;
}

@keyframes float {
    from {
        transform: translateY(100vh);
        opacity: 0;
    }
    to {
        transform: translateY(-100vh);
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="heart">❤️</div>

<script>
for (let i = 0; i < 30; i++) {
    let particle = document.createElement("div");
    particle.className = "particle";
    particle.innerHTML = "✦";

    particle.style.left = Math.random() * 100 + "vw";
    particle.style.animationDelay = Math.random() * 4 + "s";
    particle.style.fontSize = Math.random() * 15 + 5 + "px";

    document.body.appendChild(particle);
}
</script>

</body>
</html>
